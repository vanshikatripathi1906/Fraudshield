server.port=${PORT:5000}

# MongoDB Configuration (sanitized and resolved by MongoConfig)
spring.data.mongodb.uri=${MONGO_URI:}

# JWT Configuration (minimum 256 bits secret for HMAC-SHA256)
jwt.secret=${JWT_SECRET:my_super_secret_key_123_very_long_secure_key_at_least_256_bits_long_for_hmac_sha}
jwt.expiration-ms=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Client / CORS Configuration (comma-separated origins supported)
app.client.url=${CLIENT_URL:http://localhost:5173}

# Cookie Settings for Production Cross-Origin Deployments
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:}

# Logging
logging.level.com.fraudshield=INFO
logging.level.org.springframework.web=INFO
